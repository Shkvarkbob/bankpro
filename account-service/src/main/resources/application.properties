spring.application.name=account-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/accountdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:account_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

# Shared secret: only trusted internal callers (payment-service, api-gateway) may call this service.
internal.token=${INTERNAL_TOKEN:dev-internal-token}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
