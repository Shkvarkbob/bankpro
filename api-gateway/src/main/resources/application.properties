server.port=8080

spring.application.name=api-gateway

# Only explicitly listed routes are exposed (no automatic discovery routes).
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=payments
spring.cloud.gateway.server.webflux.routes[0].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/payments/**

# Only account creation and lookup are public; debit/credit/reverse-debit are internal to payment-service.
spring.cloud.gateway.server.webflux.routes[1].id=accounts-create
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/accounts
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetRequestHeader=X-Internal-Token,${internal.token}

spring.cloud.gateway.server.webflux.routes[2].id=accounts-get
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/accounts/*
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetRequestHeader=X-Internal-Token,${internal.token}

gateway.api-key=${GATEWAY_API_KEY}
internal.token=${INTERNAL_TOKEN}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
