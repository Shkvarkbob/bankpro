spring.application.name=payment-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/paymentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
internal.token=${INTERNAL_TOKEN}
# A payment stuck in PROCESSING/COMPENSATING for longer than this may be taken over by a retry.
payment.processing-timeout=60s
