services:
  account-db:
    image: postgres:15
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    networks: [bankpro-net]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U account_user -d accountdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5434:5432"]
    networks: [bankpro-net]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment_user -d paymentdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-service:
    build:
      context: .
      dockerfile: ./discovery-service/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - bankpro-net

  # The only service reachable from outside the compose network (besides Eureka UI and the DBs for local dev).
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    networks:
      - bankpro-net
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

  # Internal only: no published ports, reachable by other containers (and only with INTERNAL_TOKEN).
  account-service:
    build:
      context: .
      dockerfile: ./account-service/Dockerfile
    depends_on:
      account-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    expose:
      - "8081"
    networks:
      - bankpro-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/accountdb
      SPRING_DATASOURCE_USERNAME: account_user
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    depends_on:
      payment-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    expose:
      - "8082"
    networks:
      - bankpro-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      ACCOUNT_SERVICE_URL: http://account-service:8081
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

networks:
  bankpro-net:
    driver: bridge
